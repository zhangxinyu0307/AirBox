<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>分类查看文件</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{display:flex;padding:20px;gap:20px;font-family:微软雅黑;}
        .left-menu{width:200px;background:#fff;padding:15px;border-radius:8px;}
        .menu-item{padding:10px;margin:5px 0;background:#eee;cursor:pointer;border-radius:4px;}
        .menu-item.active{background:#007bff;color:#fff;}
        .right-list{flex:1;}
        .file-item{background:#fff;padding:12px;margin:6px 0;border-radius:6px;}
    </style>
</head>
<body>
    <div class="left-menu">
        <div class="menu-item active" data-type="all">全部</div>
        <div class="menu-item" data-type="text">文本</div>
        <div class="menu-item" data-type="image">图片</div>
        <div class="menu-item" data-type="doc">文档</div>
    </div>
    <div class="right-list" id="listBox"></div>

    <script>
        let allData = [];
        const listBox = document.getElementById('listBox');

        // 拉取全部数据
        fetch('/api/display/all')
        .then(res=>res.json())
        .then(data=>{
            allData = data;
            renderList('all');
        })

        // 渲染列表
        function renderList(type){
            let arr = type==='all' ? allData : allData.filter(item=>item.file_type===type);
            listBox.innerHTML = arr.map(i=>`
                <div class="file-item">
                    <b>${i.file_name}</b>
                    <p>类型：${i.file_type}</p >
                </div>
            `).join('')
        }

        // 点击切换分类
        document.querySelectorAll('.menu-item').forEach(item=>{
            item.onclick = ()=>{
                document.querySelectorAll('.menu-item').forEach(m=>m.classList.remove('active'));
                item.classList.add('active');
                renderList(item.dataset.type);
            }
        })
    </script>
</body>
</html>
